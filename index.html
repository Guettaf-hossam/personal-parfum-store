<!doctype html>
<html lang="ar" dir="rtl" class="dark" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Y. Parfum</title>
    <meta name="description" content="Y. Parfum — أرقى العطور الشرقية والنيش الأصلية 100%. توصيل 58 ولاية." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('parfum_store_theme') || 'dark';
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.setAttribute('data-theme', t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f6f3ee] text-[#181512] dark:bg-[#08090c] dark:text-[#f5f3ef] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
